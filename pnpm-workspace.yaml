packages:
  - playground
  - examples/*
  - packages/*

linkWorkspacePackages: 'deep'

ignoreWorkspaceRootCheck: true

strictPeerDependencies: true

allowBuilds:
  esbuild: false
  sharp: false

overrides:
  'astrobook@*': 'workspace:*'

minimumReleaseAgeExclude:
  - '@ocavue/eslint-config@4.11.0'
  - eslint-plugin-unicorn@71.0.0
